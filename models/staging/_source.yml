# models/sources.yml
version: 2

sources:
  - name: clearbank                      
    database: CLEARBANK_ANALYTICS              
    schema: RAW_CLEARBANK            
    tables:
      - name: accounts
        description: "Source table for accounts data ingested from ClearBank's operational database. Contains details of customer accounts, including balances and status."
        
      - name: cards
      - name: customers
      - name: loans
      - name: loan_repayments
      - name: transactions
        