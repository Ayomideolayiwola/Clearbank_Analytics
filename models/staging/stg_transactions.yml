version: 2

models:
  - name: stg_transactions
    description: "Staging model for clearbank's transactions data. This model performs basic transformations and cleaning on the raw transactions data ingested from ClearBank's operational database. It serves as the foundation for downstream models that will build upon this cleaned and standardized transactions data."
    columns:
      - name: transaction_id
        description: "Primary key."
        data_tests:
          - not_null
          - unique
      - name: account_id
        description: "Foreign key to the accounts table, indicating which account the transaction is associated with."
        data_tests:
          - not_null
          - relationships:
              to: ref('stg_accounts')
              field: account_id
      - name: customer_id
        description: "Foreign key to the customers table, indicating which customer made the transaction."
        data_tests:
          - not_null
          - relationships:
              to: ref('stg_customers')
              field: customer_id
      - name: transaction_date
        description: "The date when the transaction occurred."
      - name: transaction_type
        description: "Type of transaction (e.g., 'debit', 'credit')."
      - name: counterpart_name
        description: "The name of the counterparty involved in the transaction, if applicable."
      - name: counterpart_acc_no
        description: "The account number of the counterparty involved in the transaction, if applicable."
      - name: counterpart_sort_code
        description: "The sort code of the counterparty involved in the transaction, if applicable."
      - name: direction
        description: "The direction of the transaction (e.g., 'credit', 'debit')."
      - name: transaction_amount
        description: "The amount of the transaction."
      - name: currency
        description: "The currency in which the transaction was made (e.g., 'USD', 'EUR')."
      - name: balance_after
        description: "The account balance after the transaction was processed."
      - name: status
        description: "Current status of the transaction (e.g., 'completed', 'pending', 'failed')."
      - name: channel
        description: "The channel through which the transaction was made (e.g., 'online', 'branch', 'ATM')."
      - name: reference
        description: "A reference or description associated with the transaction, if applicable."
      - name: initiated_at
        description: "Timestamp when the transaction was initiated in the source system."
      - name: settled_at
        description: "Timestamp when the transaction was settled in the source system, if applicable."
      - name: created_at
        description: "Timestamp when the record was created in the source system."